<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>로그인 - MUSINSA Review TOP 10</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="card-apple login-card">
    <h2>MUSINSA Review TOP 10</h2>
    <form id="loginForm" class="flex flex-col gap-3">
      <input type="password" id="password" placeholder="비밀번호" autofocus required class="input-apple w-full" />
      <input type="submit" value="로그인" class="btn-apple w-full" />
    </form>
    <div class="error-text" id="errorText"></div>
  </div>

  <script src="/common.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const errorText = document.getElementById("errorText");
      errorText.textContent = "";
      try {
        await api("/api/login", { method: "POST", body: JSON.stringify({ password }) });
        location.href = "/index.html";
      } catch (err) {
        errorText.textContent = err.message;
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>WORK - 무신사 리뷰 모니터</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="apple-nav">
    <span class="brand">무신사 포토후기 TOP10 모니터</span>
    <div class="links">
      <a href="/index.html">대시보드</a>
      <a href="/history.html">변동이력</a>
      <a href="/work.html" class="active">WORK</a>
      <a href="/products.html">상품관리</a>
      <a href="#" id="logoutLink">로그아웃</a>
    </div>
  </div>

  <main>
    <div class="work-controls">
      <select id="productSelect" class="input-apple"></select>
      <div class="segmented" id="limitToggle">
        <button data-limit="10">TOP 10</button>
        <button data-limit="20" class="active">TOP 20</button>
        <button data-limit="30">TOP 30</button>
      </div>
      <button class="btn-apple secondary small" id="refreshBtn">새로고침</button>
    </div>
    <p class="muted mb-4">선택한 상품의 사진후기를 최신순으로 보여줍니다. 각 리뷰가 유용한순 기준 몇 위인지 함께 표시되고, 빨간 테두리로 표시한 리뷰는 기기와 상관없이 계속 저장됩니다. 썸네일을 클릭하면 사진을 크게(여러 장이면 넘겨가며) 볼 수 있고, "👍 도움돼요" 링크를 클릭하면 무신사 리뷰 페이지로 이동해 직접 "도움돼요"를 누를 수 있습니다.</p>
    <div id="content">불러오는 중...</div>
  </main>

  <script src="/common.js"></script>
  <script>
    document.getElementById("logoutLink").addEventListener("click", (e) => { e.preventDefault(); logout(); });

    let currentLimit = 20;
    let products = [];

    function usefulRankText(r) {
      return r.usefulRank ? `유용순 ${r.usefulRank}위` : `유용순위 밖 (TOP ${currentLimit} 기준)`;
    }

    let workReviewMap = {};

    function reviewCardHtml(r) {
      const images = r.imageUrls && r.imageUrls.length ? r.imageUrls : (r.imageUrl ? [r.imageUrl] : []);
      workReviewMap[r.reviewNo] = images;
      const img = images[0]
        ? `<img src="${images[0]}" alt="리뷰 이미지" loading="lazy" />`
        : `<div style="aspect-ratio:1;background:#eee"></div>`;
      const badge = images.length > 1 ? `<span class="multi-badge">1/${images.length}</span>` : "";
      return `
        <div class="review-card work-card card-apple ${r.flagged ? "flagged" : ""}" data-review-no="${r.reviewNo}">
          <button type="button" class="thumb-btn" data-thumb-review="${r.reviewNo}">${img}${badge}</button>
          <div class="body">
            <div>${r.nickname ?? "익명"}</div>
            <div>${gradeStars(r.grade)} · <a class="link-apple" href="${r.reviewUrl}" target="_blank" rel="noopener">👍 도움돼요 ${r.likeCount ?? 0}</a></div>
            <div class="muted">등록일 ${formatDateOnly(r.postedAt)}</div>
            <div class="useful-rank">${usefulRankText(r)}</div>
            <div class="review-text">${(r.content ?? "").trim() || "(작성된 텍스트 없음)"}</div>
            <label class="flag-toggle">
              <input type="checkbox" data-flag-toggle ${r.flagged ? "checked" : ""} />
              도움돼요 필요 표시
            </label>
          </div>
        </div>`;
    }

    async function loadProductOptions() {
      products = await api("/api/products");
      const select = document.getElementById("productSelect");
      if (products.length === 0) {
        select.innerHTML = `<option>등록된 상품이 없습니다</option>`;
        return null;
      }
      select.innerHTML = products
        .map((p) => `<option value="${p.id}">${p.name ?? "상품 " + p.goods_no}</option>`)
        .join("");
      return products[0].id;
    }

    async function loadWork() {
      const content = document.getElementById("content");
      const productId = document.getElementById("productSelect").value;
      if (!productId) {
        content.innerHTML = `<div class="muted">등록된 상품이 없습니다. <a class="link-apple" href="/products.html">상품관리</a>에서 추가하세요.</div>`;
        return;
      }
      content.innerHTML = "불러오는 중...";
      const list = await api(`/api/work/${productId}?limit=${currentLimit}`);
      if (list.length === 0) {
        content.innerHTML = `<div class="muted">사진후기가 없습니다.</div>`;
        return;
      }
      workReviewMap = {};
      content.innerHTML = `<div class="review-grid">${list.map(reviewCardHtml).join("")}</div>`;

      content.querySelectorAll("[data-thumb-review]").forEach((btn) => {
        btn.addEventListener("click", () => {
          openLightbox(workReviewMap[btn.dataset.thumbReview] || [], 0);
        });
      });

      content.querySelectorAll("[data-flag-toggle]").forEach((checkbox) => {
        checkbox.addEventListener("change", async () => {
          const card = checkbox.closest(".work-card");
          const reviewNo = card.dataset.reviewNo;
          const productId = document.getElementById("productSelect").value;
          checkbox.disabled = true;
          try {
            if (checkbox.checked) {
              await api(`/api/work/${productId}/flags`, {
                method: "POST",
                body: JSON.stringify({ reviewNo: Number(reviewNo) }),
              });
              card.classList.add("flagged");
            } else {
              await api(`/api/work/${productId}/flags/${reviewNo}`, { method: "DELETE" });
              card.classList.remove("flagged");
            }
          } catch (e) {
            alert(e.message);
            checkbox.checked = !checkbox.checked;
          } finally {
            checkbox.disabled = false;
          }
        });
      });
    }

    document.getElementById("limitToggle").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-limit]");
      if (!btn) return;
      document.querySelectorAll("#limitToggle button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      currentLimit = Number(btn.dataset.limit);
      loadWork();
    });

    document.getElementById("productSelect").addEventListener("change", loadWork);
    document.getElementById("refreshBtn").addEventListener("click", loadWork);

    requireAuthOrRedirect().then(async () => {
      await loadProductOptions();
      loadWork();
    });
  </script>
</body>
</html>

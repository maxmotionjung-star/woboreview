<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>대시보드 - 무신사 리뷰 모니터</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>무신사 포토후기 TOP10 모니터</h1>
    <nav class="tabs">
      <a href="/index.html" class="active">대시보드</a>
      <a href="/history.html">변동이력</a>
      <a href="/work.html">WORK</a>
      <a href="/products.html">상품관리</a>
      <a href="#" id="logoutLink">로그아웃</a>
    </nav>
  </header>

  <main>
    <div id="summaryBar" class="summary-bar"></div>

    <div class="section-heading" style="margin-top:0">
      <h2>최근 순위 변동</h2>
      <div class="range-toggle" id="rangeToggle">
        <button data-days="1" class="active">1일</button>
        <button data-days="3">3일</button>
        <button data-days="7">7일</button>
      </div>
    </div>
    <div id="recentChanges">불러오는 중...</div>

    <div class="section-heading">
      <span class="muted">사진후기만 · 유용한순 정렬 기준 TOP10</span>
      <button id="checkAllBtn">전체 지금 체크</button>
    </div>
    <div id="content">불러오는 중...</div>
  </main>

  <script src="/common.js"></script>
  <script>
    document.getElementById("logoutLink").addEventListener("click", (e) => { e.preventDefault(); logout(); });

    let dashboardReviewMap = {};

    function rankChangeBadgeHtml(r) {
      const title = "최근 7일 대비 순위 변동";
      if (r.previous_rank == null) {
        return `<span class="rank-change-badge up" title="${title}">▲ 신규</span>`;
      }
      if (r.previous_rank === r.rank) return "";
      if (r.rank < r.previous_rank) {
        return `<span class="rank-change-badge up" title="${title}">▲ ${r.previous_rank}→${r.rank}</span>`;
      }
      return `<span class="rank-change-badge down" title="${title}">▼ ${r.previous_rank}→${r.rank}</span>`;
    }

    function reviewCardHtml(r) {
      const images = r.image_urls && r.image_urls.length ? r.image_urls : (r.image_url ? [r.image_url] : []);
      dashboardReviewMap[r.review_no] = images;
      const img = images[0]
        ? `<img src="${images[0]}" alt="리뷰 이미지" loading="lazy" />`
        : `<div style="aspect-ratio:1;background:#eee"></div>`;
      const multiBadge = images.length > 1 ? `<span class="multi-badge">1/${images.length}</span>` : "";
      const rankBadge = rankChangeBadgeHtml(r);
      return `
        <div class="review-card">
          <button type="button" class="thumb-btn" data-review-no="${r.review_no}">${img}${multiBadge}</button>
          <div class="body">
            <div class="rank">${r.rank}위 ${rankBadge}</div>
            <div>${r.nickname ?? "익명"}</div>
            <div>${gradeStars(r.grade)} · <a class="helpful-link" href="${r.review_url}" target="_blank" rel="noopener">👍 도움돼요 ${r.like_count ?? 0}</a></div>
            <div class="muted">등록일 ${formatDateOnly(r.review_posted_at)}</div>
            <div class="review-text">${(r.content ?? "").trim() || "(작성된 텍스트 없음)"}</div>
          </div>
        </div>`;
    }

    async function renderProduct(p) {
      let top10 = [];
      try {
        top10 = await api(`/api/products/${p.id}/top10`);
      } catch (e) {
        // ignore, show empty state below
      }

      const capturedAt = top10[0]?.captured_at ? formatDate(top10[0].captured_at) : null;
      const grid = top10.length
        ? `<div class="review-grid">${top10.map(reviewCardHtml).join("")}</div>`
        : `<div class="muted">아직 체크 기록이 없습니다. "지금 체크"를 눌러 첫 스냅샷을 만드세요.</div>`;

      return `
        <div class="product-block">
          <div class="product-block-header">
            <div>
              <strong>${p.name ?? "상품 " + p.goods_no}</strong>
              <div class="muted">goodsNo: ${p.goods_no}${capturedAt ? " · 마지막 체크: " + capturedAt : ""}</div>
            </div>
            <button class="secondary" data-check-product="${p.id}">지금 체크</button>
          </div>
          ${grid}
        </div>`;
    }

    async function loadSummary() {
      const bar = document.getElementById("summaryBar");
      try {
        const s = await api("/api/summary");
        const lastChecked = s.lastCheckedAt ? formatDate(s.lastCheckedAt) : "체크 기록 없음";
        bar.innerHTML = `
          <div class="summary-card">
            <div class="summary-value">${s.productCount}</div>
            <div class="summary-label">모니터링 상품</div>
          </div>
          <div class="summary-card">
            <div class="summary-value">${s.changesLast24h}</div>
            <div class="summary-label">최근 24시간 변동</div>
          </div>
          <div class="summary-card">
            <div class="summary-value">${s.changesLast7d}</div>
            <div class="summary-label">최근 7일 변동</div>
          </div>
          <div class="summary-card">
            <div class="summary-value summary-value-small">${lastChecked}</div>
            <div class="summary-label">마지막 체크</div>
          </div>`;
      } catch (e) {
        bar.innerHTML = "";
      }
    }

    function rankSummary(c) {
      if (c.change_type === "entered") {
        return c.old_rank ? `${c.old_rank}위 → ${c.new_rank}위` : `신규 진입 ${c.new_rank}위`;
      }
      return `TOP10 이탈 (이전 ${c.old_rank}위)`;
    }

    let changesReviewMap = {};

    async function loadRecentChanges(days) {
      const box = document.getElementById("recentChanges");
      box.innerHTML = "불러오는 중...";
      const changes = await api(`/api/changes?days=${days}`);
      if (changes.length === 0) {
        box.innerHTML = `<div class="muted">선택한 기간 동안 변동 이력이 없습니다.</div>`;
        return;
      }
      changesReviewMap = {};
      const rows = changes.map((c) => {
        changesReviewMap[c.id] = c.image_urls || [];
        const thumb = c.image_urls && c.image_urls[0]
          ? `<button type="button" class="row-thumb-btn" data-change-id="${c.id}"><img src="${c.image_urls[0]}" alt="리뷰 이미지" loading="lazy" /></button>`
          : `<div class="muted">-</div>`;
        return `
        <tr>
          <td>${thumb}</td>
          <td>${formatDate(c.detected_at)}</td>
          <td>${c.product_name ?? "상품 " + c.goods_no}</td>
          <td><span class="badge ${c.change_type}">${c.change_type === "entered" ? "진입" : "이탈"}</span></td>
          <td>${rankSummary(c)}</td>
          <td>${c.nickname ?? "익명"}</td>
          <td><a class="helpful-link" href="${c.review_url}" target="_blank" rel="noopener">${likeChangeText(c)}</a></td>
        </tr>`;
      }).join("");
      box.innerHTML = `
        <table>
          <thead><tr><th>사진</th><th>시각</th><th>상품</th><th>구분</th><th>순위 변동</th><th>작성자</th><th>도움돼요</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;

      box.querySelectorAll("[data-change-id]").forEach((btn) => {
        btn.addEventListener("click", () => {
          openLightbox(changesReviewMap[btn.dataset.changeId] || [], 0);
        });
      });
    }

    document.getElementById("rangeToggle").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-days]");
      if (!btn) return;
      document.querySelectorAll("#rangeToggle button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      loadRecentChanges(Number(btn.dataset.days));
    });

    async function loadDashboard() {
      const content = document.getElementById("content");
      const products = await api("/api/products");
      if (products.length === 0) {
        content.innerHTML = `<div class="muted">등록된 상품이 없습니다. <a href="/products.html">상품관리</a>에서 추가하세요.</div>`;
        return;
      }
      dashboardReviewMap = {};
      const blocks = await Promise.all(products.filter((p) => p.active).map(renderProduct));
      content.innerHTML = blocks.join("");

      content.querySelectorAll("[data-review-no]").forEach((btn) => {
        btn.addEventListener("click", () => {
          openLightbox(dashboardReviewMap[btn.dataset.reviewNo] || [], 0);
        });
      });

      content.querySelectorAll("[data-check-product]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          btn.textContent = "체크 중...";
          try {
            await api("/api/check-now", {
              method: "POST",
              body: JSON.stringify({ productId: Number(btn.dataset.checkProduct) }),
            });
            await Promise.all([loadDashboard(), loadSummary()]);
          } catch (e) {
            alert(e.message);
            btn.disabled = false;
            btn.textContent = "지금 체크";
          }
        });
      });
    }

    document.getElementById("checkAllBtn").addEventListener("click", async () => {
      const btn = document.getElementById("checkAllBtn");
      btn.disabled = true;
      btn.textContent = "체크 중...";
      try {
        await api("/api/check-now", { method: "POST", body: JSON.stringify({}) });
        await Promise.all([loadDashboard(), loadSummary()]);
      } catch (e) {
        alert(e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "전체 지금 체크";
      }
    });

    requireAuthOrRedirect().then(() => {
      loadSummary();
      loadDashboard();
      loadRecentChanges(1);
    });
  </script>
</body>
</html>

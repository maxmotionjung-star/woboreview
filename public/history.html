<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>변동이력 - 무신사 리뷰 모니터</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>무신사 포토후기 TOP10 모니터</h1>
    <nav class="tabs">
      <a href="/index.html">대시보드</a>
      <a href="/history.html" class="active">변동이력</a>
      <a href="/products.html">상품관리</a>
      <a href="#" id="logoutLink">로그아웃</a>
    </nav>
  </header>

  <main>
    <p class="muted">최근 30일 TOP10 구성원 변동 이력 (신규 진입 / 이탈)</p>
    <div id="content">불러오는 중...</div>
  </main>

  <script src="/common.js"></script>
  <script>
    document.getElementById("logoutLink").addEventListener("click", (e) => { e.preventDefault(); logout(); });

    function rankSummary(c) {
      if (c.change_type === "entered") {
        return c.old_rank ? `${c.old_rank}위 → ${c.new_rank}위` : `신규 진입 ${c.new_rank}위`;
      }
      return `TOP10 이탈 (이전 ${c.old_rank}위)`;
    }

    async function loadHistory() {
      const content = document.getElementById("content");
      const changes = await api("/api/changes?days=30");
      if (changes.length === 0) {
        content.innerHTML = `<div class="muted">최근 30일간 변동 이력이 없습니다.</div>`;
        return;
      }

      const rows = changes.map((c) => `
        <tr>
          <td>${formatDate(c.detected_at)}</td>
          <td>${c.product_name ?? "상품 " + c.goods_no}</td>
          <td><span class="badge ${c.change_type}">${c.change_type === "entered" ? "진입" : "이탈"}</span></td>
          <td>${rankSummary(c)}</td>
          <td>${c.nickname ?? "익명"}</td>
          <td>${gradeStars(c.grade)}</td>
          <td>${likeChangeText(c)}</td>
        </tr>`).join("");

      content.innerHTML = `
        <table>
          <thead>
            <tr><th>시각</th><th>상품</th><th>구분</th><th>순위 변동</th><th>작성자</th><th>별점</th><th>좋아요</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    requireAuthOrRedirect().then(loadHistory);
  </script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>변동이력 - MUSINSA Review TOP 10</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="apple-nav">
    <span class="brand">MUSINSA Review TOP 10</span>
    <div class="links">
      <a href="/index.html">대시보드</a>
      <a href="/history.html" class="active">변동이력</a>
      <a href="/work.html">WORK</a>
      <a href="/products.html">상품관리</a>
      <a href="#" id="logoutLink">로그아웃</a>
    </div>
  </div>

  <main>
    <p class="muted mb-4">최근 30일 TOP10 구성원 변동 이력 (신규 진입 / 이탈)</p>
    <div class="control-group">
      <span class="control-label">상품</span>
      <select id="productFilter" class="input-apple">
        <option value="">전체 보기</option>
      </select>
    </div>
    <div id="content">불러오는 중...</div>
    <div id="historyPagination" class="pagination"></div>
  </main>

  <script src="/common.js"></script>
  <script>
    document.getElementById("logoutLink").addEventListener("click", (e) => { e.preventDefault(); logout(); });

    function rankSummary(c) {
      if (c.change_type === "entered") {
        return c.old_rank ? `${c.old_rank}위 → ${c.new_rank}위` : `신규 진입 ${c.new_rank}위`;
      }
      return `TOP10 이탈 (이전 ${c.old_rank}위)`;
    }

    let historyReviewMap = {};
    let allHistoryChanges = [];
    let historyPage = 1;
    const HISTORY_PAGE_SIZE = 10;

    async function loadProductFilterOptions() {
      const products = await api("/api/products");
      const select = document.getElementById("productFilter");
      const options = products
        .map((p) => `<option value="${p.id}">${p.name ?? "상품 " + p.goods_no}</option>`)
        .join("");
      select.innerHTML = `<option value="">전체 보기</option>${options}`;
    }

    function renderHistoryPage() {
      const content = document.getElementById("content");
      const pageBox = document.getElementById("historyPagination");
      if (allHistoryChanges.length === 0) {
        content.innerHTML = `<div class="muted">최근 30일간 변동 이력이 없습니다.</div>`;
        pageBox.innerHTML = "";
        return;
      }

      const start = (historyPage - 1) * HISTORY_PAGE_SIZE;
      const pageItems = allHistoryChanges.slice(start, start + HISTORY_PAGE_SIZE);

      historyReviewMap = {};
      const rows = pageItems.map((c) => {
        historyReviewMap[c.id] = c.image_urls || [];
        const thumb = c.image_urls && c.image_urls[0]
          ? `<button type="button" class="row-thumb-btn" data-change-id="${c.id}"><img src="${c.image_urls[0]}" alt="리뷰 이미지" loading="lazy" /></button>`
          : `<div class="muted">-</div>`;
        const badgeClass = c.change_type === "entered" ? "badge-entered" : "badge-dropped";
        return `
        <tr>
          <td>${thumb}</td>
          <td>${formatDateNoSeconds(c.detected_at)}</td>
          <td>${c.product_name ?? "상품 " + c.goods_no}</td>
          <td><span class="badge-pill ${badgeClass}">${c.change_type === "entered" ? "진입" : "이탈"}</span></td>
          <td>${rankSummary(c)}</td>
          <td>${c.nickname ?? "익명"}</td>
          <td>${formatDateOnly(c.review_posted_at)}</td>
          <td>${gradeStars(c.grade)}</td>
          <td><a class="link-apple" href="${c.review_url}" target="_blank" rel="noopener">${likeChangeText(c)}</a></td>
        </tr>`;
      }).join("");

      content.innerHTML = `
        <div class="table-wrap">
        <table class="table-apple">
          <thead>
            <tr><th>사진</th><th>변동시각</th><th>상품</th><th>구분</th><th>순위 변동</th><th>작성자</th><th>등록일</th><th>별점</th><th>도움돼요</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        </div>`;

      content.querySelectorAll("[data-change-id]").forEach((btn) => {
        btn.addEventListener("click", () => {
          openLightbox(historyReviewMap[btn.dataset.changeId] || [], 0);
        });
      });

      renderPagination(pageBox, allHistoryChanges.length, HISTORY_PAGE_SIZE, historyPage, (p) => {
        historyPage = p;
        renderHistoryPage();
      });
    }

    async function loadHistory() {
      const content = document.getElementById("content");
      content.innerHTML = "불러오는 중...";
      const productId = document.getElementById("productFilter").value;
      const query = productId ? `/api/changes?days=30&productId=${productId}` : "/api/changes?days=30";
      allHistoryChanges = await api(query);
      historyPage = 1;
      renderHistoryPage();
    }

    document.getElementById("productFilter").addEventListener("change", loadHistory);

    requireAuthOrRedirect().then(async () => {
      await loadProductFilterOptions();
      loadHistory();
    });
  </script>
</body>
</html>

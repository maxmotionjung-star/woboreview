<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>상품관리 - 무신사 리뷰 모니터</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="apple-nav">
    <span class="brand">무신사 포토후기 TOP10 모니터</span>
    <div class="links">
      <a href="/index.html">대시보드</a>
      <a href="/history.html">변동이력</a>
      <a href="/work.html">WORK</a>
      <a href="/products.html" class="active">상품관리</a>
      <a href="#" id="logoutLink">로그아웃</a>
    </div>
  </div>

  <main>
    <form class="add-product-form" id="addForm">
      <input type="url" id="url" placeholder="무신사 상품 URL (예: https://www.musinsa.com/products/5717317)" required class="input-apple" />
      <input type="text" id="name" placeholder="표시할 이름 (선택)" class="input-apple" style="max-width:200px" />
      <input type="submit" value="추가" class="btn-apple" />
    </form>
    <div class="error-text" id="errorText"></div>
    <div id="content">불러오는 중...</div>
  </main>

  <script src="/common.js"></script>
  <script>
    document.getElementById("logoutLink").addEventListener("click", (e) => { e.preventDefault(); logout(); });

    async function loadProducts() {
      const content = document.getElementById("content");
      const products = await api("/api/products");
      if (products.length === 0) {
        content.innerHTML = `<div class="muted">등록된 상품이 없습니다.</div>`;
        return;
      }
      content.innerHTML = products.map((p, i) => `
        <div class="product-list-item card-apple">
          <div class="reorder-buttons">
            <button class="btn-apple xs" data-move="up" data-id="${p.id}" ${i === 0 ? "disabled" : ""}>▲</button>
            <button class="btn-apple xs" data-move="down" data-id="${p.id}" ${i === products.length - 1 ? "disabled" : ""}>▼</button>
          </div>
          <div style="flex:1">
            <strong>${p.name ?? "상품 " + p.goods_no}</strong>
            <div class="muted">${p.url}</div>
          </div>
          <button class="btn-apple danger" data-delete="${p.id}">삭제</button>
        </div>`).join("");

      content.querySelectorAll("[data-delete]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("이 상품을 삭제하면 관련 변동이력도 함께 삭제됩니다. 계속할까요?")) return;
          await api(`/api/products/${btn.dataset.delete}`, { method: "DELETE" });
          await loadProducts();
        });
      });

      content.querySelectorAll("[data-move]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await api(`/api/products/${btn.dataset.id}/move`, {
            method: "PATCH",
            body: JSON.stringify({ direction: btn.dataset.move }),
          });
          await loadProducts();
        });
      });
    }

    document.getElementById("addForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const url = document.getElementById("url").value;
      const name = document.getElementById("name").value;
      const errorText = document.getElementById("errorText");
      errorText.textContent = "";
      try {
        await api("/api/products", { method: "POST", body: JSON.stringify({ url, name }) });
        document.getElementById("addForm").reset();
        await loadProducts();
      } catch (err) {
        errorText.textContent = err.message;
      }
    });

    requireAuthOrRedirect().then(loadProducts);
  </script>
</body>
</html>

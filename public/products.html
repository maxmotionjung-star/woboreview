<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>상품관리 - 무신사 리뷰 모니터</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>무신사 포토후기 TOP10 모니터</h1>
    <nav class="tabs">
      <a href="/index.html">대시보드</a>
      <a href="/history.html">변동이력</a>
      <a href="/products.html" class="active">상품관리</a>
      <a href="#" id="logoutLink">로그아웃</a>
    </nav>
  </header>

  <main>
    <form class="add-product-form" id="addForm">
      <input type="url" id="url" placeholder="무신사 상품 URL (예: https://www.musinsa.com/products/5717317)" required />
      <input type="text" id="name" placeholder="표시할 이름 (선택)" style="max-width:200px" />
      <input type="submit" value="추가" />
    </form>
    <div class="error-text" id="errorText"></div>
    <div id="content">불러오는 중...</div>
  </main>

  <script src="/common.js"></script>
  <script>
    document.getElementById("logoutLink").addEventListener("click", (e) => { e.preventDefault(); logout(); });

    async function loadProducts() {
      const content = document.getElementById("content");
      const products = await api("/api/products");
      if (products.length === 0) {
        content.innerHTML = `<div class="muted">등록된 상품이 없습니다.</div>`;
        return;
      }
      content.innerHTML = products.map((p) => `
        <div class="product-list-item">
          <div>
            <strong>${p.name ?? "상품 " + p.goods_no}</strong>
            <div class="muted">${p.url}</div>
          </div>
          <button class="danger" data-delete="${p.id}">삭제</button>
        </div>`).join("");

      content.querySelectorAll("[data-delete]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("이 상품을 삭제하면 관련 변동이력도 함께 삭제됩니다. 계속할까요?")) return;
          await api(`/api/products/${btn.dataset.delete}`, { method: "DELETE" });
          await loadProducts();
        });
      });
    }

    document.getElementById("addForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const url = document.getElementById("url").value;
      const name = document.getElementById("name").value;
      const errorText = document.getElementById("errorText");
      errorText.textContent = "";
      try {
        await api("/api/products", { method: "POST", body: JSON.stringify({ url, name }) });
        document.getElementById("addForm").reset();
        await loadProducts();
      } catch (err) {
        errorText.textContent = err.message;
      }
    });

    requireAuthOrRedirect().then(loadProducts);
  </script>
</body>
</html>
